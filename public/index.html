<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Paadashala After School — Student Dashboard</title>
<meta name="description" content="Mobile dashboard for Paadashala After School: attendance, fees, marks, timetable, messages and support in one place." />
<meta name="theme-color" content="#1d6473" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="stylesheet" href="stylesheets/style.css">
</head>
<body>
<main class="app">
  <header class="header">
    <div class="brand">
      <span class="brand-logo"><img src="/public/images/web-app-manifest-192x192.png" alt="Paadashala After School logo" /></span>
      <div>
        <p class="brand-name">Paadashala</p>
        <p class="brand-sub">After School</p>
      </div>
    </div>
    <div class="welcome">
      <p class="greeting"><span id="greeting">Welcome</span> <span aria-hidden="true">👋</span></p>
      <h1 class="student">Sidharth</h1>
      <p class="badge">Class 2026–2027</p>
    </div>
  </header>

  <section class="section" aria-labelledby="quick-access-heading">
    <h2 id="quick-access-heading">Quick Access</h2>
    <div class="card grid" id="quick-access"></div>
  </section>
</main>

<script>
  const I = {
    user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/>',
    attendance:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M9 15l2 2 4-4"/>',
    fees:'<rect x="2.5" y="6" width="19" height="12" rx="3"/><path d="M17 12h.01"/><path d="M2.5 10h19"/>',
    marks:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    messages:'<path d="M21 12a8 8 0 0 1-8 8H7l-4 3V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/>',
    opinion:'<path d="M4 19.5V6a2 2 0 0 1 2-2h9l5 5v10.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 4v5h5M8 13h7M8 17h5"/>',
    timetable:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M9 14h2M13 14h2M9 18h2"/>',
    support:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2" y="13" width="4" height="6" rx="2"/><rect x="18" y="13" width="4" height="6" rx="2"/><path d="M20 19a3 3 0 0 1-3 3h-3"/>'
  };
  const items = [
    ['Profile','user'],['Attendance','attendance'],['Fees','fees','accent'],['Marks','marks'],
    ['Messages','messages'],['Teacher Opinion','opinion','accent'],['Timetable','timetable'],['Technical Support','support']
  ];
  document.getElementById('quick-access').innerHTML = items.map(([label,icon,tone]) => `
    <button type="button" class="tile" ${tone?`data-tone="${tone}"`:''} aria-label="${label}">
      <span class="tile-icon"><svg viewBox="0 0 24 24" aria-hidden="true">${I[icon]}</svg></span>
      <span class="tile-label">${label}</span>
    </button>`).join('');

  function greet(){
    const h = new Date().getHours();
    return h>=5&&h<12?'Good Morning':h>=12&&h<17?'Good Afternoon':h>=17&&h<21?'Good Evening':'Good Night';
  }
  const g = document.getElementById('greeting');
  const tick = () => g.textContent = greet();
  tick(); setInterval(tick, 60000);
</script>
</body>
</html>
